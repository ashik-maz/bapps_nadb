name: quiz_master
description: "A Flutter Quiz project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  go_router: ^17.3.0
  provider: ^6.1.5+1
  dio: ^5.9.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  share_plus: ^13.1.0
  cloud_firestore: ^6.6.0
  bcrypt: ^1.2.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - images/logo.png
